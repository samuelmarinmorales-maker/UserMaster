name: Deploy Flutter Web to GitHub Pages

# Cuándo se ejecuta: en cada push a main (o a mano desde Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar versión web
        # base-href = /nombre-del-repo/ (si falta, la página sale en blanco)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar archivos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

